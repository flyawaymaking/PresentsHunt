# Do not change this value!
version: 1

# Mode Selection (HALLOWEEN, CHRISTMAS, EASTER, CUSTOM)
presentsMode: EASTER

# How many event items need to be found to receive the reward
totalPresents: 30

# Commands for each found event item and when the player finds all of them
# In these commands, you can use the variables %player%, %found%, and %total%.
commands:
  foundCommands: [ ]
  rewardCommands:
    - "give %player% diamond 10"

leaderboard:
  maxPlayersCount: 100 # How many players will be stored in the leaderboard to display their top position

# Sound when interacting with the head
sounds:
  found: "block.pumpkin.carve"
  alreadyFound: "entity.zombie.ambient"
  complete: "entity.firework_rocket.blast"

# Effects when interacting with the head
particles:
  found: "SWEEP_ATTACK"
  alreadyFound: "SQUID_INK"

# Head textures for the event
heads:
  HALLOWEEN: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWNjMTg0Y2VjNjNhOGMxNGJkNmQ1Zjg3OGEwOWNhYjg2MWM4ZWQwMzA2NGMzY2NlZjk5MTg2YmYzODBjNWQ2In19fQ=="
  CHRISTMAS: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZjBmMzM0YTlmMDU3NjA4YTQ3ZDM1MTVkOTZkYTA5YjUzYmJmYTM2YjdjYTM0MWI5NDgzY2Y1NzIwZGZiYjllOSJ9fX0="
  EASTER: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzllYzY5NDJiNjgyZGU0MmFjYmJiMTMwNTA1YWQxYWViMGJiMTc5YjA5NGFmY2ZkN2I5ZjcxNGQ0ZTYzZjFjMiJ9fX0="
  CUSTOM: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzQ5YzdjYTBmNDI1ODYxMjYyYmMxNjcwM2M3Njc2Y2NhNWJhNmI3Y2FjMGJjZGYwODY4NmNjOWE3ZWJiOTk0YSJ9fX0="

placeholders:
  status:
    completed: "&aCompleted 🎉"
    inProgress: "&eIn Progress &7(&e%found%/&a%total%&7)"
    notStarted: "&cNot Started"
  top:
    status: "&9%position%. &e%username% - %status%"
    noPlayer: "&7---"

prefix: "<red><bold>🎁</bold> <gray>» <green>"

# Messages - supports only MiniMessages format
messages:
  needPermission: "<red>You don't have permission!"
  # Messages when a player interacts with an event item
  alreadyCompleted: "<yellow>You have already received the reward for this event!"
  alreadyFound: "<yellow>You have already found this item! <gray>(<yellow>%found%</yellow>/<green>%total%</green>)"
  found: "<green>You found an event item! <gray>(<yellow>%found%</yellow>/<green>%total%</green>)"
  complete: "<gold>🎉 CONGRATULATIONS! You found all %total% items!"
  foundAllPresents: "<red>🎁 <yellow>%player% <white>found all <green>%total% <white>event items and received the reward!"
  presentPlaced: "<green>Event item successfully placed!"
  cannotBreak: "<red>You cannot break event items!"
  # Command messages
  commands:
    usage: "<red>Usage: /presentshunt <give|stats|reload|version|locate|cleanup|resetplayer|resetall|setmode|replace>"
    playersOnly: "<red>This command is for players only!"
    presentGiven: "<green>You have been given the %mode% event item!"
    stats: |
      <gold>PresentsHunt - Statistics
      <red>Completed: <gold>%completed% players (%percentage%%)
      <red>Total players participated: <gold>%total%
    reload: "<green>PresentsHunt has been reloaded!"
    version: "<green>You are using PresentsHunt version %version%"
    invalidRadius: "<red>Radius must be a number greater than 0!"
    locate:
      noneFound: "<yellow>No %mode% event items found within %radius% radius."
      found: "<green>Found %count% event items within %radius% radius: <newline> %locations%"
      location: "<gray>%index%. <yellow>[%x%, %y%, %z%]"
      hoverText: "<green>Click to teleport!"
    cleanup-success: "<green>Removed %removed% %mode% event items within %radius% radius"
    resetPlayer:
      usage: "<red>Usage: /presentshunt resetplayer <player>"
      success: "<green>Player %player%'s data has been successfully reset!"
      failed: "<red>Failed to reset player %player%'s data"
    resetAll:
      success: "<green>All players' data has been successfully reset!"
      failed: "<red>Failed to reset all players' data"
    setMode:
      usage: "<red>Usage: /presentshunt setmode <HALLOWEEN|CHRISTMAS|EASTER|CUSTOM>"
      success: "<green>Mode has been changed to <gold>%mode%</gold>!"
      failed: "<red>Mode not found"
    replace:
      usage: "<red>Usage: /presentshunt replace <FROM_MODE> <radius>"
      success: |
        <green>Replaced <gold>%replaced%</gold> <yellow>%fromMode%</yellow> event items
        with <yellow>%mode%</yellow> within a radius of <gold>%radius%</gold>.
